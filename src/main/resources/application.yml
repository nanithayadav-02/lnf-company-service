spring:
  profiles:
    active: dev

  application:
    name: lnf-company-service

server:
  port: 8081
  servlet:
    context-path: /api/v1

# Metrics Configuration
management:
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    jmx:
      exposure:
        exclude: shutdown
        include: "*"
    web:
      exposure:
        exclude:
        include: "*"
logging:
  level:
    org:
      springframework: INFO

springdoc:
  api-docs:
    path: /lnf-company
  swagger-ui:
    path: /lnf-company-api.html

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:tsdb
    username: tsuser
    password: ts@12345
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      javax:
        persistence:
          schema-generation:
            database:
              action: drop-and-create
            scripts:
              action: drop-and-create
              create-target: schema.sql
              drop-target: drop-schema.sql
              create-source: metadata
              drop-source: metadata
              create-database-schemas: true
    open-in-view: false

printStackTrace: true

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
#    url: jdbc:postgresql://${database.host:ec2-34-202-158-22.compute-1.amazonaws.com}:${database.port:5432}/${database.name:tsdb}
    url: jdbc:postgresql://${database.host:localhost}:${database.port:5432}/${database.name:company_db}
    username: ${database.username:company_user}
    password: ${database.password:company@12345}
    data: classpath*:db/data.sql
    driverClassName: ${database.drive:org.postgresql.Driver}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      javax:
        persistence:
          schema-generation:
            scripts:
              action: drop-and-create
              create-database-schemas: false
              create-target: schema.sql
              create-source: metadata
              drop-target: drop-schema.sql
              drop-source: metadata
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true

printStackTrace: true
---

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${keycloak.host:localhost:8080}/auth/realms/lnf
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
      client:
        registration:
          company-service:
            client-id: lnf-company-api
            client-secret: ${client-secret:lnf-company-api-secret}
            scope: openid,profile,roles
            authorization-grant-type: client_credentials
            provider: keycloak
        provider:
          keycloak:
            issuer-uri: http://${keycloak.host:localhost:8080}/auth/realms/lnf
